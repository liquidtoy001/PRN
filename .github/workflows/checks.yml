name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    defaults:
      run:
        working-directory: ${{ runner.temp }}/prn-checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The default workspace includes the Windows device name PRN in its parents.
      # Retrieve this exact commit into a normal path outside that workspace.
      - name: Retrieve source at tested commit
        working-directory: ${{ runner.temp }}
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import io, os, pathlib, urllib.request, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prn-checkout'
          root.mkdir(exist_ok=False)
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/zipball/' + os.environ['GITHUB_SHA']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read()
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for member in archive.infolist():
                  parts = pathlib.PurePosixPath(member.filename).parts[1:]
                  if not parts or member.is_dir():
                      continue
                  target = root.joinpath(*parts).resolve()
                  if not target.is_relative_to(root.resolve()):
                      raise ValueError('Archive path escapes checkout')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(member))
      - run: python tools/sync_shared.py --check
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m compileall -q pre-review-notes/scripts pre-review-notes-html/scripts shared/scripts tools
      - run: python tools/package_skill.py
      - run: python tools/package_skill.py --skill-dir pre-review-notes-html
