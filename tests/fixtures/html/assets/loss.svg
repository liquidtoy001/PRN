<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Squared-loss comparison</title>
  <desc id="desc">Loss is 5/3 at c=1 and c=3, and 2/3 at c=2.</desc>
  <rect width="720" height="320" fill="#fffefa"/>
  <path d="M80 40V250H670" fill="none" stroke="#283e35" stroke-width="2"/>
  <text x="20" y="30" font-size="20" fill="#283e35">L(c)</text>
  <text x="680" y="255" font-size="20" fill="#283e35">c</text>
  <rect x="150" y="75" width="100" height="175" fill="#9abaae"/>
  <rect x="320" y="180" width="100" height="70" fill="#246455"/>
  <rect x="490" y="75" width="100" height="175" fill="#9abaae"/>
  <g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#283e35">
    <text x="200" y="65">5/3</text><text x="370" y="165">2/3</text><text x="540" y="65">5/3</text>
    <text x="200" y="285">1</text><text x="370" y="285">2</text><text x="540" y="285">3</text>
  </g>
</svg>
